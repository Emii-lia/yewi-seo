[package]
name = "dioxus-seo"
version = "0.1.0"
authors = ["Emii-lia <fiaromiangaly@gmail.com>"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
dioxus = { version = "0.7.1", features = [] }
yewi-seo = { version = "1.0.0", path = "../../packages/yewi-seo" ,features = ["dioxus"] }

[features]
default = ["web"]
web = ["dioxus/web"]
desktop = ["dioxus/desktop"]
mobile = ["dioxus/mobile"]
