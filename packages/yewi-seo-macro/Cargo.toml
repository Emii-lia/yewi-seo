[package]
name = "yewi-seo-macro"
version = "0.1.1"
edition = "2024"
authors = ["Fiaro Miangaly <fiaromiangaly@gmail.com>"]
keywords = ["yew", "seo", "yewi-kit", "head", "web"]
categories = ["web-programming", "wasm", "gui"]
repository = "https://github.com/Emii-lia/yewi-seo"
description = "A Yew procedural macro library for managing SEO metadata in web applications."
license = "MIT"

[lib]
proc-macro = true

[dependencies]
syn = { version = "3.0.3", features = ["full", "extra-traits"]}
quote = "1.0.47"
proc-macro2 = "1.0.107"
rustversion.workspace = true

[dev-dependencies]
yew = "0.23.0"
trybuild = { workspace = true }
yewi-seo = { path = "../yewi-seo" }